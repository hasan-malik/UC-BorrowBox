services:
  db:
    image: postgres:15-alpine
    container_name: ucbb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ucbb
      POSTGRES_PASSWORD: ucbb_dev
      POSTGRES_DB: ucbb
    ports:
      - "5433:5432"
    volumes:
      - ucbb-pgdata:/var/lib/postgresql/data

volumes:
  ucbb-pgdata:
